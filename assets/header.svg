<svg width="100%" height="160" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#050d08" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="20%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1" />
      <stop offset="80%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <style>
      .header-title {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 32px;
        font-weight: 800;
        fill: #00FF66;
        letter-spacing: 4px;
        filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.4));
      }
      .header-sub {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #80FFB3;
        letter-spacing: 2px;
      }
      .grid-line {
        stroke: #00FF66;
        stroke-width: 0.5;
        opacity: 0.15;
      }
      .glow-border {
        stroke: #00FF66;
        stroke-width: 1.5;
        opacity: 0.6;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .pulsing-dot {
        animation: pulse 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="1000" height="160" rx="10" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="998" height="158" rx="9" fill="none" class="glow-border" />

  <line x1="50" y1="30" x2="950" y2="30" class="grid-line" />
  <line x1="50" y1="130" x2="950" y2="130" class="grid-line" />
  <line x1="100" y1="10" x2="100" y2="150" class="grid-line" />
  <line x1="900" y1="10" x2="900" y2="150" class="grid-line" />

  <circle cx="50" cy="50" r="3" fill="#00FF66" class="pulsing-dot" />
  <circle cx="950" cy="50" r="3" fill="#00FF66" class="pulsing-dot" />
  <circle cx="50" cy="110" r="3" fill="#00FF66" class="pulsing-dot" />
  <circle cx="950" cy="110" r="3" fill="#00FF66" class="pulsing-dot" />

  <text x="500" y="70" text-anchor="middle" class="header-title">ALBEY NARO JAVIER</text>
  <text x="500" y="105" text-anchor="middle" class="header-sub">&gt; FULLSTACK &amp; BACKEND DEVELOPER // HIGH-CONCURRENCY WEB APIS</text>

  <line x1="150" y1="125" x2="850" y2="125" stroke="url(#neonLine)" stroke-width="2" />
</svg>
